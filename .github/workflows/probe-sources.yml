name: probe-sources
# Разовая проба новых источников с раннера GitHub: откуда реально ходит бот.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/probe-sources.trigger"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Commons - категории техники
        run: |
          q() {
            curl -sSG "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "formatversion=2" \
              --data-urlencode "prop=categoryinfo" --data-urlencode "titles=$1" \
            | python3 -c "
          import json,sys
          for p in json.load(sys.stdin).get('query',{}).get('pages',[]):
              ci=p.get('categoryinfo')
              print(('НЕТ    ' if not ci else f\"файлов {ci['files']:>7} подкат {ci['subcats']:>4} \") + p['title'])"
          }
          q "Category:Photographs by Vitaly V. Kuzmin|Category:Images from mil.ru|Category:Images from Kremlin.ru|Category:2015 Moscow Victory Day Parade|Category:Moscow Victory Day Parade 2015|Category:Victory Day Parade in Moscow|Category:Army-2015|Category:Army-2018|Category:Tank Biathlon|Category:MAKS 2019|Category:MAKS 2017|Category:Russian Air Force|Category:Military equipment of Russia|Category:Images from the Central Museum of the Armed Forces|Category:Military vehicles of the Soviet Union|Category:Soviet military aircraft|Category:Tanks of the Soviet Union|Category:Helicopters of Russia|Category:Images from Kubinka Tank Museum"
          q "Category:World War II tanks|Category:Tanks of the Soviet Union in World War II|Category:Tanks of Germany in World War II|Category:Photographs of tanks|Category:Tanks in World War II|Category:Bundesarchiv images of tanks|Category:Armoured fighting vehicles of World War II|Category:Military aircraft in flight|Category:Moscow Victory Day Parade|Category:Moscow Victory Day Parade 2015|Category:Bastille Day military parade|Category:Images from mil.ru|Category:Photographs by the United States Navy|Category:Photographs by the United States Army|Category:Images from the US Department of Defense|Category:Images from DVIDS|Category:T-34 in World War II|Category:Tiger I in World War II|Category:Panther tanks in World War II|Category:Military parades in Red Square|Category:Images from Kremlin.ru"
          echo "--- поиск"
          for s in 'incategory:"Images from the German Federal Archive" Panzer' 'incategory:"Images from the German Federal Archive" Flugzeug' 'incategory:"SA-kuva" panssarivaunu' 'incategory:"Images from RIA Novosti" tank' 'incategory:"Photographs from the Imperial War Museum" tank' 'incategory:"Images from mil.ru" parade' 'intitle:"Victory Day Parade" 2015' 'incategory:"Photographs by Vitaly V. Kuzmin" T-90' 'incategory:"Photographs by Vitaly V. Kuzmin" Su-35' 'incategory:"Images from RIA Novosti" T-34' 'incategory:"Images from RIA Novosti" самолёт' 'incategory:"Images from RIA Novosti" aircraft' 'incategory:"Images from RIA Novosti" helicopter'; do
            sleep 1; n=$(curl -sSG "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" \
              --data-urlencode "list=search" --data-urlencode "srnamespace=6" --data-urlencode "srlimit=1" --data-urlencode "srinfo=totalhits" \
              --data-urlencode "srsearch=$s" | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"]["searchinfo"]["totalhits"])')
            echo "хитов $n  <-  $s"
          done
